# Builds the admin panel (admin/) and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Admin panel → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '!admin/config.json'
      - '.github/workflows/admin-pages.yml'
  workflow_dispatch:

# Least privilege: the build only reads the repo; only the deploy job may publish Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The repository holds gigabytes of audio: fetch only the panel and the root JSON files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: admin
          sparse-checkout-cone-mode: true
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install (no install scripts)
        working-directory: admin
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test
        working-directory: admin
        run: npm run test:run

      - name: Build
        working-directory: admin
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: admin/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
